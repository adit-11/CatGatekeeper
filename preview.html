<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Break Companion</title>
  <style>
    @font-face {
      font-family: 'Fredoka';
      src: url('fonts/fredoka-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Fredoka';
      src: url('fonts/fredoka-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-400.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Nunito';
      src: url('fonts/nunito-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      /* Theme color tokens - Cozy Bedroom (Default) */
      --bg-gradient: linear-gradient(135deg, #1f110c 0%, #351d17 50%, #4a2720 100%);
      --text-main: #FFF2EB;
      --text-muted: rgba(255, 242, 235, 0.65);
      --accent-color: #FFAE8F;
      --accent-glow: rgba(255, 174, 143, 0.25);
      --card-bg: rgba(45, 24, 19, 0.45);
      --card-border: rgba(255, 174, 143, 0.15);
      --dock-bg: rgba(35, 19, 15, 0.55);
      --dock-border: rgba(255, 174, 143, 0.12);
      --glow-color: rgba(255, 174, 143, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    /* Theme Overrides */
    .theme-cafe {
      --bg-gradient: linear-gradient(135deg, #130d0a 0%, #251812 50%, #362219 100%);
      --accent-color: #FF9B42;
      --accent-glow: rgba(255, 155, 66, 0.25);
      --card-bg: rgba(37, 24, 18, 0.45);
      --card-border: rgba(255, 155, 66, 0.15);
      --dock-bg: rgba(29, 19, 14, 0.55);
      --dock-border: rgba(255, 155, 66, 0.12);
      --glow-color: rgba(255, 155, 66, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    .theme-garden {
      --bg-gradient: linear-gradient(135deg, #09130d 0%, #15291b 50%, #203e29 100%);
      --accent-color: #8CFF9B;
      --accent-glow: rgba(140, 255, 155, 0.25);
      --card-bg: rgba(21, 41, 27, 0.45);
      --card-border: rgba(140, 255, 155, 0.15);
      --dock-bg: rgba(16, 32, 21, 0.55);
      --dock-border: rgba(140, 255, 155, 0.12);
      --glow-color: rgba(140, 255, 155, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    .theme-space {
      --bg-gradient: linear-gradient(135deg, #0a0813 0%, #17122a 50%, #251d45 100%);
      --accent-color: #BBA9FF;
      --accent-glow: rgba(187, 169, 255, 0.25);
      --card-bg: rgba(23, 18, 42, 0.45);
      --card-border: rgba(187, 169, 255, 0.15);
      --dock-bg: rgba(18, 14, 33, 0.55);
      --dock-border: rgba(187, 169, 255, 0.12);
      --glow-color: rgba(187, 169, 255, 0.08);
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', 'Nunito', sans-serif;
      color: var(--text-main);
      background: #1a0f0c;
    }

    #break-screen-container {
      width: 100%;
      height: 100%;
      background: var(--bg-gradient);
      background-size: 200% 200%;
      animation: bgShift 8s infinite ease-in-out alternate;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 30px;
      transition: background 1.5s ease;
      z-index: 1;
    }

    @keyframes bgShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Twinkling star canvas & ambient particles */
    .bg-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Glow */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      z-index: 1;
      pointer-events: none;
      animation: pulseGlow 4s infinite ease-in-out;
      transition: background 1.5s ease;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Parallax Background Assets */
    .parallax-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .parallax-item {
      position: absolute;
      opacity: 0.25;
    }

    /* Theme decorations */
    .bedroom-decor, .cafe-decor, .garden-decor, .space-decor {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }

    .active-bedroom .bedroom-decor { display: block; }
    .active-cafe .cafe-decor { display: block; }
    .active-garden .garden-decor { display: block; }
    .active-space .space-decor { display: block; }

    /* Bedroom Window Light Flicker */
    .active-bedroom .bedroom-decor svg {
      animation: warmFlicker 3s infinite ease-in-out alternate;
    }
    @keyframes warmFlicker {
      0% { opacity: 0.12; transform: scale(1); }
      100% { opacity: 0.18; transform: scale(1.03); }
    }

    /* Café Lantern Swing */
    .active-cafe .cafe-decor svg:nth-of-type(1) {
      transform-origin: 20px 0;
      animation: lanternSwingLeft 3s infinite ease-in-out alternate;
    }
    .active-cafe .cafe-decor svg:nth-of-type(2) {
      transform-origin: 20px 0;
      animation: lanternSwingRight 4s infinite ease-in-out alternate;
    }
    @keyframes lanternSwingLeft {
      0% { transform: rotate(-4deg); }
      100% { transform: rotate(4deg); }
    }
    @keyframes lanternSwingRight {
      0% { transform: rotate(3deg); }
      100% { transform: rotate(-3deg); }
    }

    /* Garden Sway */
    .active-garden .garden-decor svg {
      transform-origin: left top;
      animation: branchSway 4s infinite ease-in-out alternate;
    }
    @keyframes branchSway {
      0% { transform: rotate(-2deg) scale(0.98); }
      100% { transform: rotate(2deg) scale(1.02); }
    }

    /* Space float */
    .active-space .space-decor svg {
      animation: spaceEarthFloat 6s infinite ease-in-out alternate;
    }
    @keyframes spaceEarthFloat {
      0% { transform: translateY(-6px) rotate(-1deg); }
      100% { transform: translateY(6px) rotate(1deg); }
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      position: relative;
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-paw {
      font-size: 26px;
      display: inline-block;
      animation: pawWobble 2.5s infinite ease-in-out;
      transform-origin: bottom center;
    }

    @keyframes pawWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.1); }
      75% { transform: rotate(10deg) scale(1.1); }
    }

    .logo-section:hover .logo-paw {
      animation: pawHighFive 0.6s ease-in-out;
    }

    @keyframes pawHighFive {
      0% { transform: scale(1) rotate(0deg); }
      30% { transform: scale(1.3) rotate(-22deg); }
      70% { transform: scale(1.3) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .logo-text {
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-glow);
      letter-spacing: 0.5px;
      transition: filter 0.3s ease;
    }

    .logo-section:hover .logo-text {
      filter: brightness(1.1);
    }

    .gamification-widget {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--dock-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 6px 16px;
      box-shadow: 0 8px 32px 0 var(--shadow-color);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transition: all 0.3s ease;
    }

    .gamification-widget:hover {
      border-color: var(--accent-color);
      box-shadow: 0 8px 32px 0 var(--shadow-color), 0 0 12px var(--accent-glow);
      transform: translateY(-2px);
    }

    .xp-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .xp-level-num {
      background: var(--accent-color);
      color: #1a0f0c;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .xp-bar-container {
      width: 120px;
      height: 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .xp-bar-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      border-radius: 8px;
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .top-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .streak-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 107, 107, 0.25);
      border: 1px solid rgba(255, 107, 107, 0.4);
      color: #ffbaba;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 32px 0 rgba(255, 107, 107, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: floatFire 3s ease-in-out infinite;
      transition: all 0.2s;
    }

    .streak-badge:hover {
      background: rgba(255, 107, 107, 0.35);
      border-color: rgba(255, 107, 107, 0.6);
      box-shadow: 0 8px 32px 0 rgba(255, 107, 107, 0.25), 0 0 15px rgba(255, 107, 107, 0.3);
    }

    @keyframes floatFire {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .theme-dropdown-container {
      position: relative;
    }

    .theme-select-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      color: var(--text-main);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px var(--shadow-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .theme-select-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      transform: translateY(-2px);
      border-color: var(--accent-color);
      box-shadow: 0 6px 20px var(--shadow-color), 0 0 12px var(--accent-glow);
    }

    .theme-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: rgba(30, 20, 15, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 180px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .theme-option {
      background: none;
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s;
    }

    .theme-option:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent-color);
    }

    .theme-option.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 700;
    }

    .theme-option.locked {
      opacity: 0.4;
      cursor: not-allowed;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.3);
    }

    .settings-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px var(--shadow-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .settings-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      transform: rotate(30deg) translateY(-2px);
      border-color: var(--accent-color);
      box-shadow: 0 6px 20px var(--shadow-color), 0 0 12px var(--accent-glow);
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px var(--shadow-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      transform: scale(1.1) translateY(-2px);
      border-color: var(--accent-color);
      box-shadow: 0 6px 20px var(--shadow-color), 0 0 12px var(--accent-glow);
    }

    /* Main Dashboard Layout */
    .dashboard-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 30px;
      align-items: center;
      z-index: 5;
      position: relative;
      margin: auto 0;
    }

    /* Cozy Card Style */
    .glass-card {
      background: var(--card-bg);
      border: 4px solid var(--card-border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 8px 8px 0 var(--shadow-color);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-card:hover {
      transform: translateY(-4px);
      box-shadow: 12px 12px 0 var(--shadow-color);
    }

    /* Left Column: Cat Interactive Viewport */
    .cat-card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cat-viewport {
      width: 100%;
      height: 320px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      border: 4px solid var(--card-border);
      box-shadow: inset 0px 8px 16px rgba(0,0,0,0.3);
    }

    .cushion-platform {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      width: 190px;
      height: 35px;
      background: #ffb5c5;
      border: 4px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 4px 0 var(--shadow-color);
      z-index: 2;
      transition: all 0.3s ease;
    }
    .cushion-platform::after {
      content: '';
      position: absolute;
      inset: 2px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 14px;
    }

    /* Dynamic Cat Wrapper */
    .cat-wrapper {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translate(-50%, 0);
      width: 250px;
      height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
      z-index: 5;
    }

    .cat-wrapper.hidden {
      display: none !important;
    }

    .cat-wrapper.off-screen-left {
      transform: translate(calc(-50% - 300px), 0);
      opacity: 0;
    }

    .cat-wrapper.off-screen-right {
      transform: translate(calc(-50% + 300px), 0);
      opacity: 0;
    }

    .cat-wrapper.walking {
      animation: walkingBob 0.3s infinite alternate ease-in-out;
    }

    @keyframes walkingBob {
      0% { transform: translate(var(--walk-x, -50%), 0) rotate(-2deg) translateY(0); }
      100% { transform: translate(var(--walk-x, -50%), 0) rotate(2deg) translateY(-8px); }
    }

    .cat-wrapper.jumping {
      animation: jumpingCat 0.5s infinite alternate ease-in-out;
    }

    @keyframes jumpingCat {
      0% { transform: translate(-50%, 0) scaleY(0.9); }
      30% { transform: translate(-50%, -40px) scaleY(1.05); }
      70% { transform: translate(-50%, -80px) scaleY(1); }
      100% { transform: translate(-50%, -90px) scaleY(0.95); }
    }

    /* Head Hot-Zone overlay for Petting triggers */
    .pet-head-hotzone {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
      border-radius: 50%;
      cursor: grab;
      z-index: 100;
    }

    .pet-head-hotzone:active {
      cursor: grabbing;
    }

    /* SVG Cat details */
    .cat-svg {
      width: 230px;
      height: 230px;
      transition: transform 0.8s ease-in-out;
    }

    /* Interactive items falling or sliding inside viewport */
    .viewport-item {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      transition: transform 0.1s linear;
    }

    .food-fish {
      width: 35px;
      height: 20px;
      top: -50px;
      left: 60%;
      transform: translateX(-50%);
      animation: fallDown 0.8s forwards cubic-bezier(0.25, 1, 0.5, 1);
    }

    .water-bowl {
      width: 50px;
      height: 25px;
      bottom: 10px;
      left: 65%;
      transform: translateX(-50%) translateY(50px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .water-bowl.slide-in {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .yarn-ball {
      width: 40px;
      height: 40px;
      top: -50px;
      left: -50px;
    }

    .feather-toy {
      width: 50px;
      height: 120px;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      transition: transform 0.5s ease;
    }

    .feather-toy.swing {
      transform: translateX(-50%) translateY(100px);
    }

    @keyframes fallDown {
      0% { top: -50px; transform: translateX(-50%) rotate(0deg); }
      100% { top: 195px; transform: translateX(-50%) rotate(25deg); }
    }

    /* Speech Bubble */
    .speech-bubble {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: #fff8f0;
      color: #4a3022;
      padding: 10px 18px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 700;
      border: 3.5px solid var(--card-border);
      box-shadow: 4px 4px 0 var(--shadow-color);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
      text-align: center;
      font-family: 'Fredoka', sans-serif;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 14px;
      height: 14px;
      background: #fff8f0;
      border-right: 3.5px solid var(--card-border);
      border-bottom: 3.5px solid var(--card-border);
    }

    .speech-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* Stats Panel inside Cat Card */
    .cat-stats-panel {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat-label-group {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-value {
      font-weight: 800;
      color: var(--accent-color);
    }

    .stat-bar-track {
      height: 14px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 2.5px solid var(--card-border);
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    .fill-happiness {
      background: #ff7da7;
    }

    .fill-energy {
      background: #5de0e6;
    }

    /* Right Column: Timer & Wellness */
    .timer-card-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100%;
      padding: 16px 0;
    }

    .timer-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-main);
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 var(--shadow-color);
    }

    .timer-digits-wrapper {
      position: relative;
    }

    .timer-digits {
      font-family: 'Fredoka', sans-serif;
      font-size: 110px;
      font-weight: 800;
      color: var(--accent-color);
      letter-spacing: 1.5px;
      line-height: 1.0;
      text-shadow: 6px 6px 0 var(--shadow-color);
    }

    .wellness-tips-container {
      margin-top: 35px;
      width: 100%;
      max-width: 360px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wellness-tip {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text-muted);
      position: absolute;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s ease;
      text-align: center;
    }

    .wellness-tip.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Bottom Dock Bar */
    .bottom-dock {
      background: var(--dock-bg);
      border: 4px solid var(--card-border);
      border-radius: 35px;
      padding: 14px 24px;
      display: flex;
      gap: 16px;
      box-shadow: 0 8px 0 var(--shadow-color), 0 15px 30px rgba(0, 0, 0, 0.4);
      z-index: 10;
      margin-bottom: 15px;
      position: relative;
      transition: all 0.3s ease;
    }

    .dock-btn {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      border: 3.5px solid var(--card-border);
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 5px 0 var(--card-border);
      transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dock-btn[data-action="feed"] { background: #ffebee; }
    .dock-btn[data-action="water"] { background: #e0f7fa; }
    .dock-btn[data-action="play"] { background: #f3e5f5; }
    .dock-btn[data-action="toy"] { background: #fff3e0; }
    .dock-btn[data-action="pet"] { background: #fce4ec; }
    .dock-btn[data-action="sleep"] { background: #ede7f6; }

    .dock-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 0 var(--card-border);
      filter: brightness(1.05) saturate(1.1);
    }

    .dock-btn:active {
      transform: translateY(5px);
      box-shadow: 0 0px 0 var(--card-border);
    }

    .dock-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 12px);
      left: 50%;
      transform: translateX(-50%) translateY(5px);
      background: #0f0a1e;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .dock-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Particle Eruption Container */
    .particles-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }

    .particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: particleFloat 1.2s forwards ease-out;
    }

    @keyframes particleFloat {
      0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot)); opacity: 0; }
    }

    /* ── Wandering Kittens ────────────────────────────────────────── */
    #kitten-stage {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 12;         /* above all UI elements so they don't hide behind anything */
      overflow: hidden;
    }

    .mini-kitten {
      position: absolute;
      width: 52px;
      height: 52px;
      transition: left 0.1s linear, bottom 0.1s linear;
      will-change: transform, left, bottom;
      pointer-events: auto; /* enable cursor hover detection */
    }

    .mini-kitten svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.18));
    }

    .mini-kitten .k-tail { transform-origin: 58px 78px; }
    .mini-kitten .k-head { transform-origin: 43px 38px; }
    .mini-kitten .k-lpaw-group { transform-origin: 22px 90px; }
    .mini-kitten .k-rpaw-group { transform-origin: 58px 90px; }

    /* --- Sitting / Idle --- */
    .mini-kitten.sitting svg { animation: kittenSit 2.0s ease-in-out infinite; }
    .mini-kitten.sitting .k-tail { animation: kittenTailWag 1.0s ease-in-out infinite; }
    .mini-kitten.sitting .k-head { animation: kittenHeadTilt 3.0s ease-in-out infinite; }

    @keyframes kittenSit {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.02, 0.98); }
    }
    @keyframes kittenTailWag {
      0%, 100% { transform: rotate(-10deg); }
      50%      { transform: rotate(10deg); }
    }
    @keyframes kittenHeadTilt {
      0%, 100% { transform: rotate(0deg); }
      33%      { transform: rotate(-3deg) translateY(0.5px); }
      66%      { transform: rotate(3deg) translateY(-0.5px); }
    }

    /* --- Walking --- */
    .mini-kitten.walking svg { animation: kittenWalk 0.5s ease-in-out infinite; }
    .mini-kitten.walking .k-tail { animation: kittenTailWagWalk 0.25s ease-in-out infinite; }
    .mini-kitten.walking .k-lpaw-group { animation: pawSwingL 0.5s ease-in-out infinite; }
    .mini-kitten.walking .k-rpaw-group { animation: pawSwingR 0.5s ease-in-out infinite; }
    .mini-kitten.walking .k-head { animation: kittenHeadBobWalk 0.5s ease-in-out infinite; }

    @keyframes kittenWalk {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50%      { transform: translateY(-3px) rotate(1deg); }
    }
    @keyframes kittenTailWagWalk {
      0%, 100% { transform: rotate(-15deg); }
      50%      { transform: rotate(0deg); }
    }
    @keyframes pawSwingL {
      0%, 100% { transform: translateY(0) rotate(-12deg); }
      50%      { transform: translateY(-2px) rotate(12deg); }
    }
    @keyframes pawSwingR {
      0%, 100% { transform: translateY(-2px) rotate(12deg); }
      50%      { transform: translateY(0) rotate(-12deg); }
    }
    @keyframes kittenHeadBobWalk {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(1.5px) rotate(1deg); }
    }

    /* --- Running (Sprint like VS Code pets!) --- */
    .mini-kitten.running svg { animation: kittenRun 0.24s linear infinite; }
    .mini-kitten.running .k-tail { animation: kittenTailSpin 0.12s linear infinite; }
    .mini-kitten.running .k-lpaw-group { animation: pawRunL 0.24s linear infinite; }
    .mini-kitten.running .k-rpaw-group { animation: pawRunR 0.24s linear infinite; }
    .mini-kitten.running .k-head { animation: kittenHeadBobRun 0.24s linear infinite; }

    @keyframes kittenRun {
      0%, 100% { transform: translateY(0) scale(1.08, 0.92) rotate(-3deg); }
      50%      { transform: translateY(-7px) scale(0.92, 1.08) rotate(3deg); }
    }
    @keyframes kittenTailSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pawRunL {
      0%, 100% { transform: translate(-3px, -2px) rotate(-35deg); }
      50%      { transform: translate(3px, 1px) rotate(25deg); }
    }
    @keyframes pawRunR {
      0%, 100% { transform: translate(3px, 1px) rotate(25deg); }
      50%      { transform: translate(-3px, -2px) rotate(-35deg); }
    }
    @keyframes kittenHeadBobRun {
      0%, 100% { transform: translate(1px, 1px) rotate(-1.5deg); }
      50%      { transform: translate(-1px, -2.5px) rotate(1.5deg); }
    }

    /* Modal dialog for Settings */
    .settings-modal {
      position: fixed;
      inset: 0;
      background: rgba(26, 15, 12, 0.85);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .settings-modal.visible {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #fff8f0;
      border: 4px solid var(--card-border);
      border-radius: 32px;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      box-shadow: 8px 8px 0 var(--shadow-color);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #4a3022;
    }

    .settings-modal.visible .modal-content {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: var(--card-border);
    }

    .modal-close {
      background: none;
      border: none;
      color: #8c7b72;
      font-size: 28px;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #4a3022;
    }

    .settings-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-group label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #7a5844;
      font-weight: 700;
    }

    .settings-input {
      background: #fff;
      border: 3.5px solid var(--card-border);
      border-radius: 14px;
      color: #4a3022;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    .settings-input:focus {
      border-color: var(--accent-color);
      background: #fff8f0;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #e0dcd3;
      transition: .3s;
      border-radius: 24px;
      border: 2.5px solid var(--card-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
      border: 1.5px solid var(--card-border);
    }

    input:checked + .slider {
      background-color: var(--accent-color);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #fff8f0;
    }

    .save-modal-btn {
      width: 100%;
      background: var(--accent-color);
      color: #fff8f0;
      border: 3px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      margin-top: 10px;
      box-shadow: 0 4px 0 var(--card-border);
    }

    .save-modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--card-border);
    }

    .save-modal-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0px 0 var(--card-border);
    }

    /* SVGs Tail Wiggle */
    #cgTail1 { transform-origin: 90px 170px; animation: tailWag1 1.8s infinite ease-in-out; }
    #cgTail2 { transform-origin: 105px 170px; animation: tailWag2 1.8s infinite ease-in-out; }
    #cgTail3 { transform-origin: 90px 170px; animation: tailWag3 1.8s infinite ease-in-out; }

    @keyframes tailWag1 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes tailWag2 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes tailWag3 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(14deg); }
    }

    .wag-fast #cgTail1 { animation: tailWagFast1 0.5s infinite ease-in-out !important; }
    .wag-fast #cgTail2 { animation: tailWagFast2 0.5s infinite ease-in-out !important; }
    .wag-fast #cgTail3 { animation: tailWagFast3 0.5s infinite ease-in-out !important; }

    @keyframes tailWagFast1 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(26deg); }
    }
    @keyframes tailWagFast2 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-26deg); }
    }
    @keyframes tailWagFast3 {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(24deg); }
    }

    /* Head Tilt for random gestures */
    .tilt-cat .cat-svg {
      animation: headTilt 2s infinite ease-in-out;
    }
    @keyframes headTilt {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(5deg); }
    }

    /* Ear twitches */
    #cgCat1 polygon:nth-of-type(1), #cgCat1 polygon:nth-of-type(2) {
      transform-origin: center;
      animation: earTwitch 6s infinite;
    }
    @keyframes earTwitch {
      0%, 90%, 94%, 98%, 100% { transform: rotate(0deg); }
      92% { transform: rotate(-5deg); }
      96% { transform: rotate(5deg); }
    }

    /* Eye Blinking */
    .blink-eye {
      animation: blinkAnimation 4s infinite ease-in-out;
    }
    @keyframes blinkAnimation {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.05); }
    }

    /* Sleeping Cat State CSS */
    .sleeping-cat .blink-eye, .sleeping-cat .cgPupilLeft, .sleeping-cat .cgPupilRight {
      transform: scaleY(0.05) !important;
      animation: none !important;
    }
    .sleeping-cat #cgRightEyeOpen, .sleeping-cat #cgLeftEyeWink, .sleeping-cat #cgEyeSquint3 {
      transform: scaleY(0.05) !important;
      animation: none !important;
    }
    .sleeping-cat .cat-svg {
      transform: rotate(6deg) translateY(22px) scaleY(0.85) scaleX(1.05) !important;
    }

    /* Petting/Happy Cat state CSS */
    .happy-cat-blush .cgBlush path, .happy-cat-blush .cgBlush ellipse {
      fill: #ff3366 !important;
      opacity: 0.9 !important;
      transform: scale(1.2);
      transform-origin: center;
      transition: all 0.3s;
    }

    /* Paw waving */
    .waving-paw .cgPawLeft, .waving-paw .cgPawLeft2, .waving-paw .cgPawLeft3 {
      animation: pawWave 0.3s infinite alternate ease-in-out;
    }
    @keyframes pawWave {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(-10px) rotate(-20deg); }
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      #break-screen-container {
        padding: 15px;
        overflow-y: auto;
      }
      .cat-viewport {
        height: 260px;
      }
      .cat-wrapper {
        width: 200px;
        height: 200px;
        bottom: 10px;
      }
      .cat-svg {
        width: 180px;
        height: 180px;
      }
      .timer-digits {
        font-size: 64px;
      }
      .bottom-dock {
        padding: 8px 12px;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .dock-btn {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
    }

    /* Mouth Animation Classes */
    .cgMouthOpen {
      display: none !important;
    }
    .open-mouth .cgMouthNormal {
      display: none !important;
    }
    .open-mouth .cgMouthOpen {
      display: inline !important;
    }

    /* Cat Name Tag */
    .cat-name-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--dock-bg);
      border: 3.5px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      box-shadow: 3px 3px 0 var(--shadow-color);
      margin-bottom: 6px;
    }
    .edit-name-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .edit-name-btn:hover {
      transform: scale(1.2);
    }

    /* Snooze button styling */
    .snooze-btn {
      background: rgba(240,128,128,0.1);
      border: 1.5px dashed rgba(240,128,128,0.4);
      color: #f08080;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .snooze-btn:hover {
      background: rgba(240,128,128,0.2);
      border-style: solid;
      color: #fff;
    }
  </style>
</head>

            <button class="theme-option" data-theme="cafe" id="theme-opt-cafe" title="Complete 2 eye saves today to unlock">Cat Café <span style="font-size:10px; opacity:0.6;">(2🔥)</span></button>
            <button class="theme-option" data-theme="garden" id="theme-opt-garden" title="Complete 4 eye saves today to unlock">Cozy Garden <span style="font-size:10px; opacity:0.6;">(4🔥)</span></button>
            <button class="theme-option" data-theme="space" id="theme-opt-space" title="Complete 7 eye saves today to unlock">Space Station <span style="font-size:10px; opacity:0.6;">(7🔥)</span></button>
          </div>
        </div>

        <button class="sound-btn" id="sound-toggle-btn" title="Toggle Sound">🔊</button>
        <button class="settings-btn" id="settings-toggle-btn" title="Settings">⚙️</button>
      </div>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid">
      
      <!-- Left Glass Card: Interactive Cat & Status -->
      <div class="glass-card">
        <div class="cat-card-content">
          
          <div class="cat-name-tag" id="cat-name-container">
            <span id="cat-name-display">Companion</span>
            <button class="edit-name-btn" id="edit-cat-name-btn" title="Rename Cat">✏️</button>
          </div>
          
          <!-- Viewport -->
          <div class="cat-viewport" id="cat-viewport-box">
            
            <div class="cushion-platform"></div>
            
            <!-- Speech Bubble -->
            <div class="speech-bubble" id="cat-speech-bubble">Hello human!</div>

            <!-- Pet Head Hotzone -->
            <div class="pet-head-hotzone" id="pet-hotzone"></div>

            <!-- Cat 1: Ginger & White Kitten -->
            <div class="cat-wrapper off-screen-left hidden" id="cat-wrapper-1">
              <svg id="cgCat1" class="cat-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 12px 25px rgba(244,198,141,0.25))">
                <path id="cgTail1" d="M100 200 Q70 230 50 210 Q30 190 60 175 Q80 160 100 200Z" fill="#ffb88c" />
                <ellipse cx="100" cy="175" rx="55" ry="50" fill="#ffffff" stroke="#ffebd8" stroke-width="1.5"/>
                <path d="M125 140 Q150 160 145 190 Q120 180 125 140" fill="#ffb88c" />
                <circle cx="100" cy="105" r="52" fill="#ffffff" stroke="#ffebd8" stroke-width="1.5"/>
                <path d="M85 55 Q100 75 115 55 Q100 53 85 55" fill="#ffb88c" />
                <path d="M52 90 Q65 105 52 120 Z" fill="#ffb88c" />
                <polygon points="55,65 40,25 80,58" fill="#ffffff" stroke="#ffebd8" stroke-width="1"/>
                <polygon points="145,65 160,25 120,58" fill="#ffffff" stroke="#ffebd8" stroke-width="1"/>
                <polygon points="58,63 48,35 76,60" fill="#ffb8b8"/>
                <polygon points="142,63 152,35 124,60" fill="#ffb8b8"/>
                
                <g class="cgBow" style="transform: translate(50px, 55px) rotate(-15deg); transform-origin: 0 0;">
                  <circle cx="0" cy="0" r="4" fill="#ff7da7"/>
                  <path d="M-4 0 L-12 -6 L-12 6 Z" fill="#ff9cb9"/>
                  <path d="M4 0 L12 -6 L12 6 Z" fill="#ff9cb9"/>
                </g>
                <g class="cgBow" style="transform: translate(150px, 55px) rotate(15deg); transform-origin: 0 0;">
                  <circle cx="0" cy="0" r="4" fill="#ff7da7"/>
                  <path d="M-4 0 L-12 -6 L-12 6 Z" fill="#ff9cb9"/>
                  <path d="M4 0 L12 -6 L12 6 Z" fill="#ff9cb9"/>
                </g>
                
                <g class="cgEyes">
                  <g class="cgEyeLeftContainer blink-eye" style="transform-origin: 80px 100px;">
                    <g class="cgPupilLeft">
                      <ellipse cx="80" cy="100" rx="9" ry="10" fill="#2d2d2d"/>
                      <circle cx="83" cy="97" r="3" fill="white"/>
                      <circle cx="78" cy="103" r="1.2" fill="white"/>
                    </g>
                  </g>
                  <g class="cgEyeRightContainer blink-eye" style="transform-origin: 120px 100px;">
                    <g class="cgPupilRight">
                      <ellipse cx="120" cy="100" rx="9" ry="10" fill="#2d2d2d"/>
                      <circle cx="123" cy="97" r="3" fill="white"/>
                      <circle cx="118" cy="103" r="1.2" fill="white"/>
                    </g>
                  </g>
                </g>
                
                <g class="cgBlush">
                  <path d="M72 110 C70 106 63 106 63 111 C63 115 72 120 72 120 C72 120 81 115 81 111 C81 106 74 106 72 110 Z" fill="#ff7da7" opacity="0.4"/>
                  <path d="M128 110 C126 106 119 106 119 111 C119 115 128 120 128 120 C128 120 137 115 137 111 C137 106 130 106 128 110 Z" fill="#ff7da7" opacity="0.4"/>
                </g>
                
                <polygon points="100,114 96,119 104,119" fill="#ff7da7"/>
                <path class="cgMouthNormal" d="M94,121 Q97,125 100,121 Q103,125 106,121" stroke="#ff7da7" stroke-width="1.8" fill="none"/>
                <g class="cgMouthOpen">
                  <!-- Mouth Cavity -->
                  <path d="M93,121 Q100,119 107,121 Q108,131 100,131 Q92,131 93,121 Z" fill="#3a1d1d" stroke="#ff7da7" stroke-width="1.8"/>
                  <!-- Tongue -->
                  <path d="M96,127 Q100,124 104,127 Q102,131 100,131 Q98,131 96,127 Z" fill="#ff9cb9"/>
                </g>
                <line x1="55" y1="115" x2="72" y2="117" stroke="#bbb" stroke-width="1.2"/>
                <line x1="53" y1="121" x2="71" y2="121" stroke="#bbb" stroke-width="1.2"/>
                <line x1="128" y1="117" x2="145" y2="115" stroke="#bbb" stroke-width="1.2"/>
                <line x1="129" y1="121" x2="147" y2="121" stroke="#bbb" stroke-width="1.2"/>
                
                <ellipse cx="100" cy="180" rx="28" ry="25" fill="#fff5e8" opacity="0.7"/>
                <ellipse class="cgPawLeft" cx="75" cy="215" rx="14" ry="9" fill="#ffffff" stroke="#ffebd8"/>
                <ellipse class="cgPawRight" cx="125" cy="215" rx="14" ry="9" fill="#ffffff" stroke="#ffebd8"/>
              </svg>
            </div>



            <!-- Falling Food Elements inside Viewport -->
            <svg id="food-fish-svg" class="viewport-item food-fish" viewBox="0 0 24 16" style="display:none;">
              <path d="M2 8 C 4 3, 16 1, 20 8 C 16 15, 4 13, 2 8 Z" fill="#ff8b8b" stroke="#000" stroke-width="0.8"/>
              <polygon points="20,8 24,4 23,8 24,12" fill="#ff8b8b" stroke="#000" stroke-width="0.8"/>
              <circle cx="6" cy="6" r="1" fill="black"/>
            </svg>

            <svg id="water-bowl-svg" class="viewport-item water-bowl" viewBox="0 0 30 18">
              <ellipse cx="15" cy="12" rx="14" ry="5" fill="#5de0e6" stroke="#ffffff" stroke-width="1"/>
              <ellipse cx="15" cy="8" rx="13" ry="4" fill="#8bf3ff" opacity="0.8"/>
              <path d="M1 8 C 1 12, 5 17, 15 17 C 25 17, 29 12, 29 8 Z" fill="#32b5ba" stroke="#ffffff" stroke-width="1.5"/>
            </svg>

            <svg id="yarn-ball-svg" class="viewport-item yarn-ball" viewBox="0 0 32 32" style="display:none;">
              <circle cx="16" cy="16" r="14" fill="#a892ee" stroke="#ffffff" stroke-width="1.2"/>
              <path d="M16 2 Q24 8 20 16 T16 30" fill="none" stroke="#633bba" stroke-width="1.5"/>
              <path d="M2 16 Q8 24 16 20 T30 16" fill="none" stroke="#633bba" stroke-width="1.5"/>
              <path d="M22 4 Q12 12 10 24" fill="none" stroke="#e0d6ff" stroke-width="1"/>
            </svg>

            <svg id="feather-svg" class="viewport-item feather-toy" viewBox="0 0 20 80" style="display:none;">
              <line x1="10" y1="0" x2="10" y2="50" stroke="#f4c68d" stroke-width="1.5"/>
              <path d="M10 30 Q-2 42 10 54 Q22 42 10 30" fill="#ffd5a1" opacity="0.9"/>
              <path d="M10 45 Q2 58 10 70 Q18 58 10 45" fill="#ffcbd5" opacity="0.9"/>
              <path d="M10 55 Q-5 68 10 80 Q25 68 10 55" fill="#c3d5ff" opacity="0.9"/>
            </svg>

          </div>

          <!-- Meters -->
          <div class="cat-stats-panel">
            <div class="stat-row">
              <div class="stat-label-group">
                <span>Happiness</span>
                <span class="stat-value" id="happiness-val">80%</span>
              </div>
              <div class="stat-bar-track">
                <div class="stat-bar-fill fill-happiness" id="happiness-bar" style="width: 80%;"></div>
              </div>
            </div>

            <div class="stat-row">
              <div class="stat-label-group">
                <span>Energy</span>
                <span class="stat-value" id="energy-val">70%</span>
              </div>
              <div class="stat-bar-track">
                <div class="stat-bar-fill fill-energy" id="energy-bar" style="width: 70%;"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Right Glass Card: Countdown & Wellness -->
      <div class="glass-card" style="height: 100%;">
        <div class="timer-card-content">
          <div class="timer-title">🐱 Cat Time Left</div>
          
          <div class="timer-digits-wrapper">
            <div class="timer-digits" id="countdown-display">05:00</div>
          </div>

          <!-- Snooze Button -->
          <div class="snooze-wrapper" style="margin-top: 12px; margin-bottom: 8px; text-align: center;">
            <button id="snooze-btn" class="snooze-btn" title="Postpone break by 15 minutes (clicks left: 3)" aria-label="Snooze break for 15 minutes">
              Snooze 15 min (3 clicks)
            </button>
          </div>

          <div class="wellness-tips-container" id="tips-container">
            <!-- Tips will be injected dynamically -->
          </div>
        </div>
      </div>

    </div>

    <!-- Bottom Dock -->
    <div class="bottom-dock">
      <button class="dock-btn" data-action="feed" data-tooltip="Feed Fish (🐟)" aria-label="Feed Fish">🐟</button>
      <button class="dock-btn" data-action="water" data-tooltip="Give Water (💧)" aria-label="Give Water">💧</button>
      <button class="dock-btn" data-action="play" data-tooltip="Play Yarn Ball (🧶)" aria-label="Play Yarn Ball">🧶</button>
      <button class="dock-btn" data-action="toy" data-tooltip="Feather Toy (🪶)" aria-label="Feather Toy">🪶</button>
      <button class="dock-btn" data-action="pet" data-tooltip="Pet Head (🖐️)" aria-label="Pet Head">🖐️</button>
      <button class="dock-btn" data-action="sleep" data-tooltip="Put to Sleep (😴)" id="sleep-btn" aria-label="Toggle Sleep">😴</button>
    </div>

    <!-- Eruption particle layer -->
    <div class="particles-layer" id="particle-emitter"></div>
  </div>

  <!-- Settings Modal Dialog -->
  <div class="settings-modal" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="modal-close" id="settings-close-btn">&times;</button>
      </div>

      <div class="settings-group">
        <label for="username-input">Your Name</label>
        <input type="text" class="settings-input" id="username-input" placeholder="Enter your name" value="Friend">
      </div>

      <div class="toggle-row">
        <label style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight:600;">Sound Effects</label>
        <label class="switch">
          <input type="checkbox" id="sound-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <button class="save-modal-btn" id="settings-save-btn">Save & Close</button>
  </div>

  <!-- Adopt / Naming Modal Dialog -->
  <div class="settings-modal" id="naming-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="naming-modal-title">Name Your Companion</h3>
        <button class="modal-close" id="naming-close-btn" style="display: none;">&times;</button>
      </div>
      <div style="text-align: center; margin-bottom: 15px;">
        <span style="font-size: 40px; display: inline-block; animation: pawWobble 2.5s infinite ease-in-out;">🐱</span>
        <p style="font-size: 14px; font-weight: 600; color: #7a5844; margin-top: 10px;">
          Your break companion needs a name! What would you like to call them?
        </p>
      </div>
      <div class="settings-group">
        <label for="cat-name-input">Companion's Name</label>
        <input type="text" class="settings-input" id="cat-name-input" placeholder="e.g. Mochi, Luna, Oliver..." maxlength="15">
      </div>
      <button class="save-modal-btn" id="naming-submit-btn">Adopt Companion ❤️</button>
    </div>
  </div>

  <script src="src/break.js"></script>
</body>
</html>
